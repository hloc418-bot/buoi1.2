<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi lời nhắn</title>
    <!-- Link Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .contact-form { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card contact-form border-0">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold text-primary">Gửi lời nhắn cho tôi</h2>
                    <p class="text-center text-muted mb-5">Đừng ngần ngại liên hệ, mình sẽ phản hồi bạn sớm nhất có thể!</p>

                    <form id="messageForm">
                        <!-- Họ tên -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="name" placeholder="Nguyễn Văn A" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <!-- Tiêu đề -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">Tiêu đề</label>
                            <select class="form-select" id="subject">
                                <option selected>Hợp tác công việc</option>
                                <option value="1">Góp ý nội dung</option>
                                <option value="2">Hỏi đáp</option>
                                <option value="3">Khác</option>
                            </select>
                        </div>

                        <!-- Nội dung -->
                        <div class="mb-4">
                            <label for="message" class="form-label">Lời nhắn của bạn</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung tại đây..." required></textarea>
                        </div>

                        <!-- Nút gửi -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">Gửi lời nhắn ngay</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Link Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Một chút JavaScript để thông báo khi gửi (giả lập)
    document.getElementById('messageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Cảm ơn bạn! Lời nhắn của bạn đã được gửi đi (giả lập).');
        this.reset();
    });
</script>

</body>
</html>
